name: rlbench
task_type: single_dataset
task_modes: []

shape_meta: &shape_meta
  image_resolution: 256
  action:
    shape:
    - 10
  obs:
    agentview_rgb:
      shape:
      - 3
      - 256
      - 256
      type: rgb
    language:
      shape:
      - 15

shape_meta_env: &shape_meta_env
  image_resolution: 256
  action:
    shape:
    - 10
  obs:
    agentview_image:
      shape:
      - 3
      - 256
      - 256
      type: rgb
      
dataset:
  _target_: unified_video_action.dataset.rlbench_dataset_pn.RLBenchDataset
  shape_meta: *shape_meta
  abs_action: true
  dataset_path: /gpfs/u/home/LMCG/LMCGhazh/scratch/enroot/rlbench_data/root/RACER-DataGen/racer_datagen/runs_uva/val
  language_emb_model: clip
  horizon: 32
  n_obs_steps: 16
  pad_after: 7
  pad_before: 1
  rotation_rep: rotation_6d
  seed: 42
  use_cache: true
  val_ratio: 0.02
  data_aug: true
  normalizer_type: all
  language_uncond_ratio: 0.1

env_runner:
  _target_: unified_video_action.env_runner.rlbench_runner.RLBenchRunner
  abs_action: true
  max_steps: 500
  n_action_steps: 8
  n_obs_steps: 16
  past_action: false
  tqdm_interval_sec: 1.0
